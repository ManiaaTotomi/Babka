<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="styles.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function ThemeToggle({ theme, onToggle }) {
            const isDark = theme === 'dark';
            return (
                <button
                    type="button"
                    className="theme-toggle"
                    onClick={onToggle}
                    title={isDark ? 'Switch to light mode' : 'Switch to dark mode'}
                    aria-label={isDark ? 'Switch to light mode' : 'Switch to dark mode'}
                >
                    {isDark ? (
                        <svg className="theme-toggle__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                        </svg>
                    ) : (
                        <svg className="theme-toggle__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <circle cx="12" cy="12" r="5" />
                            <line x1="12" y1="1" x2="12" y2="3" />
                            <line x1="12" y1="21" x2="12" y2="23" />
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                            <line x1="1" y1="12" x2="3" y2="12" />
                            <line x1="21" y1="12" x2="23" y2="12" />
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                        </svg>
                    )}
                </button>
            );
        }

        function downloadTxt(content, fileName) {
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(url);
        }

        function FancyButton({ children, isPurple, downloadContent, downloadFileName }) {
            const [bubble, setBubble] = useState({ x: 0, y: 0, show: false });
            const btnRef = useRef(null);

            const handleMouseMove = (e) => {
                if (!btnRef.current) return;
                const rect = btnRef.current.getBoundingClientRect();
                setBubble({
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top,
                    show: true,
                });
            };

            const handleMouseLeave = () => setBubble((b) => ({ ...b, show: false }));

            const handleClick = () => {
                if (downloadContent != null && downloadFileName) {
                    downloadTxt(downloadContent, downloadFileName);
                }
            };

            return (
                <button
                    ref={btnRef}
                    className={`download-button ${isPurple ? 'download-button--purple' : ''}`}
                    onMouseMove={handleMouseMove}
                    onMouseLeave={handleMouseLeave}
                    onClick={handleClick}
                >
                    <span
                        className={`button-bubble ${bubble.show ? 'button-bubble--open' : ''}`}
                        style={{
                            left: bubble.x,
                            top: bubble.y,
                        }}
                    />
                    <span className="button-text">{children}</span>
                </button>
            );
        }

        function Card({ id, title, price, includesText, features, buttonText, isSpanRow, isHovered, onHover }) {
            const cardClass = `card ${isSpanRow ? 'card-span-row' : ''} ${isHovered ? 'card-hovered' : ''}`;
            const downloadContent = id === 'pickles'
                ? [title, price, includesText, ...features].join('\n')
                : null;
            const downloadFileName = id === 'pickles' ? 'pickles.txt' : null;
            return (
                <div
                    className={cardClass}
                    onMouseEnter={() => onHover(id)}
                    onMouseLeave={() => onHover(null)}
                >
                    <h1 className="card-title">{title}</h1>
                    <p className="card-price">{price}</p>
                    <div className="card-content">
                        <p className="includes-text">{includesText}</p>
                        <ul className="features-list">
                            {features.map((text, i) => (
                                <li key={i}>
                                    <span className="checkmark">✓</span>
                                    {text}
                                </li>
                            ))}
                        </ul>
                    </div>
                    <FancyButton
                        isPurple={isSpanRow}
                        downloadContent={downloadContent}
                        downloadFileName={downloadFileName}
                    >
                        {buttonText}
                    </FancyButton>
                </div>
            );
        }

        function App() {
            const [hoveredCard, setHoveredCard] = useState(null);
            const [theme, setTheme] = useState('dark');

            useEffect(() => {
                document.body.setAttribute('data-theme', theme);
            }, [theme]);

            const toggleTheme = () => setTheme((t) => (t === 'dark' ? 'light' : 'dark'));

            return (
                <>
                    <ThemeToggle theme={theme} onToggle={toggleTheme} />
                    <div className="pricing-section">
                        <h1 className="pricing-header">Choose your plan</h1>
                    <div className="cards-container">
                    <div className="cards-row">
                        <Card
                            id="pickles"
                            title="Pickles"
                            price="Free"
                            includesText="Includes:"
                            features={[
                                'No credit card required',
                                'Limited Agent requests',
                                'Limited Tab completions',
                            ]}
                            buttonText="Download"
                            isSpanRow={false}
                            isHovered={hoveredCard === 'pickles'}
                            onHover={setHoveredCard}
                        />
                        <Card
                            id="cheese"
                            title="Cheese"
                            price="$20/mo."
                            includesText="Everything in Hobby, plus:"
                            features={[
                                'Extended limits on Agent',
                                'Unlimited Tab completions',
                                'Background Agents',
                                'Maximum context windows',
                            ]}
                            buttonText="Get Pro"
                            isSpanRow={false}
                            isHovered={hoveredCard === 'cheese'}
                            onHover={setHoveredCard}
                        />
                    </div>
                    <Card
                        id="meat"
                        title="Meat"
                        price="$10/mo."
                        includesText="Includes:"
                        features={['meat']}
                        buttonText="Get Meat"
                        isSpanRow={true}
                        isHovered={hoveredCard === 'meat'}
                        onHover={setHoveredCard}
                    />
                    </div>
                    </div>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
